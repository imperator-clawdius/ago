<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1115" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f6f7f9" media="(prefers-color-scheme: light)">
<meta name="description" content="Ago — one-tap tracker for how long it's been since you last did anything.">
<title>Ago — how long has it been?</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ago">
<style>
  :root {
    --bg: #f6f7f9; --card: #ffffff; --text: #16181d; --muted: #6b7280;
    --line: #e5e7eb; --accent: #2563eb; --accent-text: #ffffff;
    --fresh: #16a34a; --aging: #d97706; --overdue: #dc2626;
    --shadow: 0 1px 3px rgba(0,0,0,.08), 0 4px 14px rgba(0,0,0,.05);
    --radius: 16px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1115; --card: #191c23; --text: #eceef2; --muted: #9aa1ad;
      --line: #2a2e38; --accent: #3b82f6; --accent-text: #ffffff;
      --fresh: #22c55e; --aging: #f59e0b; --overdue: #ef4444;
      --shadow: 0 1px 3px rgba(0,0,0,.4), 0 4px 14px rgba(0,0,0,.3);
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    background: var(--bg); color: var(--text); min-height: 100%;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 18px 20px 8px; max-width: 560px; margin: 0 auto;
  }
  header h1 { font-size: 26px; letter-spacing: -0.5px; }
  header h1 span { color: var(--accent); }
  .iconbtn {
    background: none; border: none; color: var(--muted); font-size: 20px;
    cursor: pointer; padding: 8px; border-radius: 10px; line-height: 1;
  }
  .iconbtn:hover { background: var(--line); color: var(--text); }
  main { max-width: 560px; margin: 0 auto; padding: 6px 16px 120px; }
  .empty {
    text-align: center; color: var(--muted); padding: 60px 24px; line-height: 1.6;
  }
  .empty .big { font-size: 44px; margin-bottom: 12px; }
  .card {
    background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow);
    padding: 14px 16px; margin: 10px 0; display: flex; align-items: center; gap: 12px;
    border-left: 5px solid var(--line); transition: border-color .3s;
  }
  .card.fresh   { border-left-color: var(--fresh); }
  .card.aging   { border-left-color: var(--aging); }
  .card.overdue { border-left-color: var(--overdue); }
  .card .emoji { font-size: 30px; width: 40px; text-align: center; flex-shrink: 0; }
  .card .info { flex: 1; min-width: 0; cursor: pointer; }
  .card .name { font-weight: 600; font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card .ago { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; margin-top: 2px; }
  .card .ago.overdue-t { color: var(--overdue); font-weight: 600; }
  .card .ago.aging-t { color: var(--aging); }
  .didit {
    flex-shrink: 0; border: none; background: var(--accent); color: var(--accent-text);
    font-size: 15px; font-weight: 700; padding: 10px 16px; border-radius: 12px;
    cursor: pointer; transition: transform .08s;
  }
  .didit:active { transform: scale(.94); }
  .fab {
    position: fixed; right: 20px; bottom: calc(24px + env(safe-area-inset-bottom));
    width: 60px; height: 60px; border-radius: 50%; border: none;
    background: var(--accent); color: var(--accent-text); font-size: 30px;
    box-shadow: 0 6px 20px rgba(0,0,0,.25); cursor: pointer; line-height: 1;
  }
  .fab:active { transform: scale(.92); }
  dialog {
    border: none; border-radius: 20px; background: var(--card); color: var(--text);
    padding: 24px; width: min(92vw, 420px); box-shadow: 0 20px 60px rgba(0,0,0,.35);
    margin: auto;
  }
  dialog::backdrop { background: rgba(0,0,0,.45); backdrop-filter: blur(2px); }
  dialog h2 { font-size: 19px; margin-bottom: 16px; }
  label { display: block; font-size: 13px; color: var(--muted); margin: 14px 0 5px; font-weight: 600; }
  input[type=text], input[type=number], select {
    width: 100%; padding: 11px 12px; border: 1px solid var(--line); border-radius: 10px;
    background: var(--bg); color: var(--text); font-size: 16px;
  }
  .row { display: flex; gap: 10px; }
  .row > * { flex: 1; }
  .emoji-row { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
  .emoji-pick {
    font-size: 22px; padding: 6px 9px; border-radius: 10px; border: 1px solid var(--line);
    background: var(--bg); cursor: pointer;
  }
  .emoji-pick.sel { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 15%, var(--bg)); }
  .dlg-actions { display: flex; gap: 10px; margin-top: 22px; }
  .btn {
    flex: 1; padding: 12px; border-radius: 12px; border: none; font-size: 15px;
    font-weight: 700; cursor: pointer;
  }
  .btn.primary { background: var(--accent); color: var(--accent-text); }
  .btn.ghost { background: transparent; color: var(--muted); border: 1px solid var(--line); }
  .btn.danger { background: transparent; color: var(--overdue); border: 1px solid var(--overdue); }
  .history { max-height: 180px; overflow-y: auto; margin-top: 8px; }
  .history li { list-style: none; padding: 7px 2px; border-bottom: 1px solid var(--line); font-size: 14px; color: var(--muted); display:flex; justify-content: space-between; }
  .toast {
    position: fixed; left: 50%; transform: translateX(-50%);
    bottom: calc(100px + env(safe-area-inset-bottom));
    background: var(--text); color: var(--bg); padding: 11px 18px; border-radius: 999px;
    font-size: 14px; font-weight: 600; box-shadow: var(--shadow); display: flex; gap: 14px;
    align-items: center; opacity: 0; pointer-events: none; transition: opacity .25s;
    z-index: 50; white-space: nowrap;
  }
  .toast.show { opacity: 1; pointer-events: auto; }
  .toast button { background: none; border: none; color: var(--accent); font-weight: 800; font-size: 14px; cursor: pointer; }
  .menu-sheet { padding: 10px 0; }
  .menu-sheet button {
    display: block; width: 100%; text-align: left; padding: 13px 22px; background: none;
    border: none; color: var(--text); font-size: 16px; cursor: pointer;
  }
  .menu-sheet button:hover { background: var(--line); }
  .suggest-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 4px; }
  .suggest-grid button {
    padding: 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg);
    color: var(--text); font-size: 14px; cursor: pointer; text-align: left;
  }
  .footer-note { text-align: center; color: var(--muted); font-size: 12px; margin-top: 30px; line-height: 1.7; }
  .footer-note a { color: var(--accent); text-decoration: none; }
</style>
</head>
<body>
<header>
  <h1>Ago<span>.</span></h1>
  <button class="iconbtn" id="menuBtn" aria-label="Menu">⋯</button>
</header>
<main>
  <div id="list"></div>
  <div class="empty" id="empty" hidden>
    <div class="big">⏳</div>
    <strong>How long has it been?</strong><br>
    Track anything you do <em>sometimes</em> — water the plants,<br>
    change the sheets, call Mom, swap the filter.<br><br>
    Tap <strong>+</strong> to add your first thing.
  </div>
  <div class="footer-note" id="footNote" hidden>
    Tap a card for history · data never leaves this device
  </div>
</main>

<button class="fab" id="addBtn" aria-label="Add item">+</button>

<div class="toast" id="toast"><span id="toastMsg"></span><button id="undoBtn">UNDO</button></div>

<!-- Add / Edit dialog -->
<dialog id="editDlg">
  <h2 id="dlgTitle">New thing to track</h2>
  <label for="nameIn">What is it?</label>
  <input type="text" id="nameIn" maxlength="60" placeholder="e.g. Watered the plants" autocomplete="off">
  <div class="suggest-grid" id="suggests"></div>
  <label>Icon</label>
  <div class="emoji-row" id="emojiRow"></div>
  <label for="threshNum">Remind-me threshold (turns red after…)</label>
  <div class="row">
    <input type="number" id="threshNum" min="0" step="1" placeholder="none">
    <select id="threshUnit">
      <option value="3600000">hours</option>
      <option value="86400000" selected>days</option>
      <option value="604800000">weeks</option>
    </select>
  </div>
  <div class="dlg-actions">
    <button class="btn ghost" id="cancelBtn">Cancel</button>
    <button class="btn primary" id="saveBtn">Save</button>
  </div>
</dialog>

<!-- Detail / history dialog -->
<dialog id="detailDlg">
  <h2 id="detTitle"></h2>
  <div style="color:var(--muted);font-size:14px" id="detSub"></div>
  <label>History</label>
  <ul class="history" id="histList"></ul>
  <div class="dlg-actions">
    <button class="btn danger" id="delBtn">Delete</button>
    <button class="btn ghost" id="editBtn">Edit</button>
    <button class="btn primary" id="closeDetBtn">Close</button>
  </div>
</dialog>

<!-- Menu dialog -->
<dialog id="menuDlg" class="menu-sheet-dlg">
  <div class="menu-sheet">
    <button id="exportBtn">⬇️ &nbsp;Export data (JSON)</button>
    <button id="importBtn">⬆️ &nbsp;Import data</button>
    <button id="aboutBtn">ℹ️ &nbsp;About Ago</button>
    <button id="closeMenuBtn" style="color:var(--muted)">Close</button>
  </div>
</dialog>
<input type="file" id="importFile" accept=".json,application/json" hidden>

<script>
'use strict';
/* ============ state ============ */
const LS_KEY = 'ago.items.v1';
const $ = id => document.getElementById(id);
let items = load();
let editingId = null;   // null = adding
let detailId = null;
let undoState = null;   // {items snapshot, msg}
let toastTimer = null;

function load() {
  try { return JSON.parse(localStorage.getItem(LS_KEY)) || []; }
  catch { return []; }
}
function save() { localStorage.setItem(LS_KEY, JSON.stringify(items)); }
function uid() { return Math.random().toString(36).slice(2, 10) + Date.now().toString(36); }

/* ============ time formatting ============ */
function fmtAgo(ms) {
  if (ms < 0) ms = 0;
  const s = Math.floor(ms / 1000);
  if (s < 60) return 'just now';
  const m = Math.floor(s / 60);
  if (m < 60) return m + 'm ago';
  const h = Math.floor(m / 60);
  if (h < 24) return h + 'h ' + (m % 60) + 'm ago';
  const d = Math.floor(h / 24);
  if (d < 7) return d + 'd ' + (h % 24) + 'h ago';
  const w = Math.floor(d / 7);
  if (d < 60) return w + 'w ' + (d % 7) + 'd ago';
  const mo = Math.floor(d / 30.44);
  if (mo < 12) return mo + 'mo ago';
  const y = Math.floor(d / 365.25);
  return y + 'y ' + Math.floor((d % 365.25) / 30.44) + 'mo ago';
}
function fmtStamp(t) {
  return new Date(t).toLocaleString(undefined, { month:'short', day:'numeric', hour:'numeric', minute:'2-digit' });
}

/* ============ rendering ============ */
function stateOf(it) {
  if (!it.last) return '';
  if (!it.threshold) return 'fresh';
  const elapsed = Date.now() - it.last;
  if (elapsed >= it.threshold) return 'overdue';
  if (elapsed >= it.threshold * 0.75) return 'aging';
  return 'fresh';
}
function render() {
  const list = $('list');
  list.innerHTML = '';
  $('empty').hidden = items.length > 0;
  $('footNote').hidden = items.length === 0;
  // overdue first, then by longest-since
  const sorted = [...items].sort((a, b) => {
    const rank = s => s === 'overdue' ? 0 : s === 'aging' ? 1 : 2;
    const ra = rank(stateOf(a)), rb = rank(stateOf(b));
    if (ra !== rb) return ra - rb;
    return (a.last || 0) - (b.last || 0);
  });
  for (const it of sorted) {
    const st = stateOf(it);
    const card = document.createElement('div');
    card.className = 'card ' + st;
    card.dataset.id = it.id;
    const agoTxt = it.last ? fmtAgo(Date.now() - it.last) : 'never — tap Did it!';
    const agoCls = st === 'overdue' ? 'ago overdue-t' : st === 'aging' ? 'ago aging-t' : 'ago';
    card.innerHTML =
      '<div class="emoji">' + it.emoji + '</div>' +
      '<div class="info"><div class="name"></div><div class="' + agoCls + '" data-ago></div></div>' +
      '<button class="didit">Did it ✓</button>';
    card.querySelector('.name').textContent = it.name;
    card.querySelector('[data-ago]').textContent = agoTxt;
    card.querySelector('.didit').onclick = e => { e.stopPropagation(); markDone(it.id); };
    card.querySelector('.info').onclick = () => openDetail(it.id);
    list.appendChild(card);
  }
}
/* live tick — update times without full re-render */
setInterval(() => {
  document.querySelectorAll('.card').forEach(card => {
    const it = items.find(i => i.id === card.dataset.id);
    if (it && it.last) card.querySelector('[data-ago]').textContent = fmtAgo(Date.now() - it.last);
  });
}, 30000);

/* ============ actions ============ */
function markDone(id) {
  snapshot('Marked done');
  const it = items.find(i => i.id === id);
  if (!it) return;
  it.last = Date.now();
  it.history = it.history || [];
  it.history.unshift(it.last);
  if (it.history.length > 100) it.history.length = 100;
  save(); render();
  toast('✓ ' + it.name);
  if (navigator.vibrate) navigator.vibrate(15);
}
function snapshot(msg) { undoState = { items: JSON.parse(JSON.stringify(items)), msg }; }
function toast(msg) {
  $('toastMsg').textContent = msg;
  $('toast').classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => $('toast').classList.remove('show'), 3500);
}
$('undoBtn').onclick = () => {
  if (undoState) { items = undoState.items; undoState = null; save(); render(); }
  $('toast').classList.remove('show');
};

/* ============ add / edit ============ */
const EMOJIS = ['🪴','🛏️','🧺','💧','🐱','🐶','🚗','🦷','💊','📞','🧹','🔋','🏋️','💇','🌡️','🧯','🗑️','💾','❤️','📅','☕','🎸'];
const SUGGESTIONS = [
  ['🪴','Watered the plants', 7, 86400000],
  ['🛏️','Changed the sheets', 14, 86400000],
  ['💧','Replaced water filter', 60, 86400000],
  ['📞','Called Mom', 7, 86400000],
  ['🐱','Cleaned litter box', 2, 86400000],
  ['💾','Backed up phone', 30, 86400000],
];
let pickedEmoji = EMOJIS[0];

function buildEmojiRow() {
  const row = $('emojiRow');
  row.innerHTML = '';
  for (const e of EMOJIS) {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'emoji-pick' + (e === pickedEmoji ? ' sel' : '');
    b.textContent = e;
    b.onclick = () => { pickedEmoji = e; buildEmojiRow(); };
    row.appendChild(b);
  }
}
function buildSuggests() {
  const g = $('suggests');
  g.innerHTML = '';
  if (editingId) { g.hidden = true; return; }
  g.hidden = false;
  for (const [emo, name, n, unit] of SUGGESTIONS) {
    if (items.some(i => i.name === name)) continue;
    const b = document.createElement('button');
    b.type = 'button'; b.textContent = emo + ' ' + name;
    b.onclick = () => {
      $('nameIn').value = name; pickedEmoji = emo; buildEmojiRow();
      $('threshNum').value = n; $('threshUnit').value = String(unit);
    };
    g.appendChild(b);
  }
}
function openEditor(id) {
  editingId = id || null;
  $('dlgTitle').textContent = id ? 'Edit' : 'New thing to track';
  if (id) {
    const it = items.find(i => i.id === id);
    $('nameIn').value = it.name;
    pickedEmoji = it.emoji;
    if (it.threshold) {
      const units = [604800000, 86400000, 3600000];
      const u = units.find(u => it.threshold % u === 0) || 86400000;
      $('threshNum').value = it.threshold / u;
      $('threshUnit').value = String(u);
    } else { $('threshNum').value = ''; }
  } else {
    $('nameIn').value = ''; $('threshNum').value = ''; pickedEmoji = EMOJIS[0];
  }
  buildEmojiRow(); buildSuggests();
  $('editDlg').showModal();
  if (!id) setTimeout(() => $('nameIn').focus(), 50);
}
$('addBtn').onclick = () => openEditor(null);
$('cancelBtn').onclick = () => $('editDlg').close();
$('saveBtn').onclick = () => {
  const name = $('nameIn').value.trim();
  if (!name) { $('nameIn').focus(); return; }
  const n = parseFloat($('threshNum').value);
  const threshold = (n > 0) ? Math.round(n * Number($('threshUnit').value)) : null;
  if (editingId) {
    const it = items.find(i => i.id === editingId);
    it.name = name; it.emoji = pickedEmoji; it.threshold = threshold;
  } else {
    items.push({ id: uid(), name, emoji: pickedEmoji, threshold, last: null, history: [] });
  }
  save(); render();
  $('editDlg').close();
};

/* ============ detail ============ */
function openDetail(id) {
  detailId = id;
  const it = items.find(i => i.id === id);
  if (!it) return;
  $('detTitle').textContent = it.emoji + ' ' + it.name;
  $('detSub').textContent = it.last
    ? 'Last done ' + fmtAgo(Date.now() - it.last) + ' · ' + fmtStamp(it.last)
    : 'Never done yet';
  const ul = $('histList');
  ul.innerHTML = '';
  const hist = it.history || [];
  if (!hist.length) ul.innerHTML = '<li>No history yet</li>';
  hist.slice(0, 30).forEach((t, i) => {
    const li = document.createElement('li');
    const gap = i + 1 < hist.length ? fmtAgo(t - hist[i + 1]).replace(' ago','') + ' gap' : '';
    li.innerHTML = '<span>' + fmtStamp(t) + '</span><span>' + gap + '</span>';
    ul.appendChild(li);
  });
  $('detailDlg').showModal();
}
$('closeDetBtn').onclick = () => $('detailDlg').close();
$('editBtn').onclick = () => { $('detailDlg').close(); openEditor(detailId); };
$('delBtn').onclick = () => {
  snapshot('Deleted');
  const it = items.find(i => i.id === detailId);
  items = items.filter(i => i.id !== detailId);
  save(); render();
  $('detailDlg').close();
  toast('Deleted “' + it.name + '”');
};

/* ============ menu / export / import ============ */
$('menuBtn').onclick = () => $('menuDlg').showModal();
$('closeMenuBtn').onclick = () => $('menuDlg').close();
$('exportBtn').onclick = () => {
  const blob = new Blob([JSON.stringify({ app:'ago', v:1, items }, null, 2)], { type:'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'ago-backup-' + new Date().toISOString().slice(0,10) + '.json';
  a.click();
  URL.revokeObjectURL(a.href);
  $('menuDlg').close();
};
$('importBtn').onclick = () => { $('menuDlg').close(); $('importFile').click(); };
$('importFile').onchange = async e => {
  const f = e.target.files[0];
  if (!f) return;
  try {
    const data = JSON.parse(await f.text());
    const incoming = Array.isArray(data) ? data : data.items;
    if (!Array.isArray(incoming)) throw new Error('bad format');
    snapshot('Imported');
    // merge by id, imported wins
    const byId = new Map(items.map(i => [i.id, i]));
    for (const it of incoming) if (it && it.id && it.name) byId.set(it.id, it);
    items = [...byId.values()];
    save(); render();
    toast('Imported ' + incoming.length + ' items');
  } catch { toast('Import failed — not an Ago backup'); }
  e.target.value = '';
};
$('aboutBtn').onclick = () => {
  $('menuDlg').close();
  alert('Ago v1.0\n\nOne-tap tracker for everything you do "sometimes."\nAll data stays on your device. No account, no cloud, no tracking.\n\nAdd to Home Screen to use it like a native app.');
};

/* ============ boot ============ */
render();
if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
</body>
</html>
